": {"src": "img/pov_hands_1.jpg", "box": {"left": 22.77, "top": 8.87, "width": 26.66, "height": 47.98}}}, {"src": "photos/02_frontal_imbiss.jpg", "thought": "The beard always saves a little for later.", "tpl": {"src": "img/pov_hands_2.jpg", "box": {"left": 22.77, "top": 8.87, "width": 26.66, "height": 47.88}}}, {"src": "photos/03_laecheln_cap.jpg", "thought": "Durag under a cap. Peak fashion. Don't ask.", "tpl": {"src": "img/pov_hands_1.jpg", "box": {"left": 22.77, "top": 8.87, "width": 26.66, "height": 47.98}}}, {"src": "photos/04_profil_gipfeli.jpg", "thought": "Swiss life, day one. The croissant is mine now.", "tpl": {"src": "img/pov_hands_2.jpg", "box": {"left": 22.77, "top": 8.87, "width": 26.66, "height": 47.88}}}, {"src": "photos/01_gesicht_im_loch.jpg", "thought": "Don't remember this one. Better that way.", "tpl": {"src": "img/pov_hands_1.jpg", "box": {"left": 22.77, "top": 8.87, "width": 26.66, "height": 47.98}}}, {"src": "photos/02_schwimmbrille.jpg", "thought": "Goggles on. Problems off.", "tpl": {"src": "img/pov_hands_2.jpg", "box": {"left": 22.77, "top": 8.87, "width": 26.66, "height": 47.88}}}, {"src": "photos/03_thermalbad.jpg", "thought": "Low cortisol arc. Episode one.", "tpl": {"src": "img/pov_hands_1.jpg", "box": {"left": 22.77, "top": 8.87, "width": 26.66, "height": 47.98}}}, {"src": "photos/04_trinkflasche_pose.jpg", "thought": "Hydrated. Unbothered. Untouchable.", "tpl": {"src": "img/pov_hands_2.jpg", "box": {"left": 22.77, "top": 8.87, "width": 26.66, "height": 47.88}}}], "wall_after": "1.1", "unbox_intro": "Unpacking. One box he couldn't lock away.", "date": "06.11.2026  ·  25"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

/* ---------- Sequence: one list for both modes ---------- */
function splitChapter(name) {
  const m = String(name || "").match(/^(Chapter \d+|Prologue|Finale)\.?\s*(.*)$/i);
  return m ? [m[1], m[2]] : [name || "", ""];
}
const items = [];
let last = null;
DATA.scenes.forEach((s, i) => {
  if (i === 0) { items.push({ kind: "cover", scene: s, chapter: s.chapter }); return; }
  if (s.chapter && s.chapter !== last) { items.push({ kind: "chapter", chapter: s.chapter }); last = s.chapter; }
  if (s.reveal) {
    /* Reveal: lands on the back of a turning page (odd index = left page) and stands alone */
    if (items.length % 2 === 0) items.push({ kind: "teaser", scene: s, chapter: s.chapter });
    items.push({ kind: "panel", scene: s, chapter: s.chapter, reveal: true });
    items.push({ kind: "intro", scene: s, chapter: s.chapter });
  } else items.push({ kind: "panel", scene: s, chapter: s.chapter });
  if (s.id === DATA.wall_after) DATA.photos.forEach((ph, k) => items.push({ kind: "photo", photo: ph, first: k === 0, chapter: s.chapter }));
});
items.push({ kind: "end", chapter: items[items.length - 1].chapter });
const N = items.length;

function content(item) {
  if (item.kind === "cover" || item.kind === "panel") {
    const s = item.scene;
    if (s.img) return `<img class="${item.kind === "cover" ? "cover" : "panel"}" src="${s.img}" alt="${esc(s.alt)}" loading="lazy" decoding="async">`;
    const lines = [s.narration, ...(s.dialogue || []).map(d => `${d.speaker}: ${d.text}`)].filter(Boolean).map(esc).join("<br>");
    return `<div class="card chapter"><div class="num" style="font-size:clamp(28px,4vw,72px)">${esc(s.id)}</div><div class="name">${lines}</div></div>`;
  }
  if (item.kind === "chapter") { const [a, b] = splitChapter(item.chapter);
    return `<div class="card chapter"><div class="num">${esc(a)}</div>${b ? `<div class="name">${esc(b)}</div>` : ""}<div class="rule"></div></div>`; }
  if (item.kind === "photo") { const ph = item.photo, t = ph.tpl;
    const intro = item.first && DATA.unbox_intro ? `<div class="unbox-intro">${esc(DATA.unbox_intro)}</div>` : "";
    const bubble = `<div class="thought">${esc(ph.thought)}</div>`;
    if (t) { const b = t.box;
      return `<div class="unbox"><img class="tpl" src="${t.src}" alt="" loading="lazy"><img class="orig" src="${ph.src}" alt="Original photo of Avin" loading="lazy" style="left:${b.left}%;top:${b.top}%;width:${b.width}%;height:${b.height}%">${intro}${bubble}</div>`; }
    return `<div class="unbox fallback"><div class="card-photo"><img src="${ph.src}" alt="Original photo of Avin" loading="lazy"></div>${intro}${bubble}</div>`; }
  if (item.kind === "teaser") { const s = item.scene;
    return `<div class="teaser">${s.img ? `<img src="${s.img}" alt="" loading="lazy">` : ""}<div class="t-text">${esc(s.teaser || "Turn the page.")}</div><div class="t-turn">Turn the page &rarr;</div></div>`; }
  if (item.kind === "intro") { const s = item.scene;
    return `<div class="intro"><div class="slash"></div><div class="i-name">${esc(s.caption)}</div><div class="i-sub">${esc(s.subtitle)}</div></div>`; }
  if (item.kind === "end") return `<div class="card end"><div class="date">${esc(DATA.date)}</div><div class="small">${esc(DATA.title)}</div></div>`;
  return "";
}

/* ---------- Header + footer ---------- */
let current = 0;
const foot = $("#foot");
let prevChap = null;
const segs = items.map((it, i) => {
  if (i > 0 && it.chapter !== prevChap) foot.appendChild(Object.assign(document.createElement("span"), { className: "gap" }));
  prevChap = it.chapter;
  const s = document.createElement("span"); s.className = "seg"; s.title = `${i + 1} / ${N}`;
  s.onclick = () => go(i); foot.appendChild(s); return s;
});
function updateUI() {
  const [a, b] = splitChapter(items[current].chapter);
  $("#chap").innerHTML = `${esc(a)}${b ? `<i>${esc(b)}</i>` : ""}`;
  $("#count").textContent = `${current + 1} / ${N}`;
  $("#prev").disabled = current === 0;
  $("#next").disabled = current >= N - 1;
  segs.forEach((s, i) => { s.classList.toggle("done", i < current); s.classList.toggle("now", i === current); });
  if (current >= N - 2) confetti();
  flash(current);
  const wrap = $(".book-wrap"); const pages = book ? book.getPageCount() : 0;
  const idx = book ? book.getCurrentPageIndex() : current;
  wrap.classList.toggle("front", mode() === "book" && idx === 0);
  wrap.classList.toggle("backside", mode() === "book" && book && idx >= pages - 1);
  store.set("avin-page", current);
}

/* ---------- Cinema ---------- */
const cine = $("#cinema-view");
const slides = items.map(it => { const d = document.createElement("div"); d.className = "slide" + (it.reveal ? " reveal" : ""); d.innerHTML = content(it); cine.appendChild(d); return d; });
const revealed = new Set();
function flash(i) { if (!items[i]?.reveal || revealed.has(i) || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  revealed.add(i); const f = $("#flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go"); }
function showCinema(i) { slides.forEach((s, k) => s.classList.toggle("on", k === i));
  [i - 1, i + 1, i + 2].forEach(k => slides[k]?.querySelectorAll("img").forEach(img => img.loading = "eager")); }

/* ---------- Book ---------- */
const bookEl = $("#book");
items.forEach((it, i) => {
  const p = document.createElement("div");
  const hard = it.kind === "cover" || it.kind === "end";
  p.className = "page" + (hard ? " hard" : "") + (it.kind === "end" ? " back" : "");
  if (hard) p.dataset.density = "hard";
  p.innerHTML = it.kind === "cover" || it.kind === "end" ? content(it) : `<div class="inner">${content(it)}</div><div class="pnum">${i + 1}</div>`;
  if (it.kind === "photo") p.querySelector(".inner").style.padding = "2.2%";
  bookEl.appendChild(p);
});
/* even page count so the back cover closes the book */
if (N % 2 === 1) { const back = bookEl.lastElementChild; const blank = document.createElement("div"); blank.className = "page"; bookEl.insertBefore(blank, back); }

let book = null;
function initBook() {
  if (book || typeof St === "undefined") return;
  book = new St.PageFlip(bookEl, {
    width: 750, height: 500, size: "stretch", minWidth: 280, maxWidth: 750, minHeight: 187, maxHeight: 500,
    showCover: true, usePortrait: true, maxShadowOpacity: .55, flippingTime: 900, mobileScrollSupport: false,
  });
  book.loadFromHTML(bookEl.querySelectorAll(".page"));
  book.on("flip", e => { current = Math.min(e.data, N - 1); updateUI(); });
}

/* ---------- Navigation ---------- */
function mode() { return document.body.dataset.mode; }
function go(i) {
  i = Math.max(0, Math.min(N - 1, i));
  if (mode() === "book" && book) book.turnToPage(i);
  else showCinema(i);
  current = i; updateUI();
}
function next() { if (mode() === "book" && book) book.flipNext(); else go(current + 1); }
function prev() { if (mode() === "book" && book) book.flipPrev(); else go(current - 1); }
$("#next").onclick = next; $("#prev").onclick = prev;
addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); next(); }
  if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prev(); }
});
let tx = null;
cine.addEventListener("touchstart", e => tx = e.touches[0].clientX, { passive: true });
cine.addEventListener("touchend", e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 40) (dx < 0 ? next : prev)(); tx = null; });
cine.addEventListener("click", e => { (e.clientX > innerWidth / 3 ? next : prev)(); });

function setMode(m) {
  document.body.dataset.mode = m; store.set("avin-mode", m);
  document.querySelectorAll(".mode button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
  if (m === "book") { initBook(); book && book.turnToPage(current); }
  else showCinema(current);
  updateUI();
}
document.querySelectorAll(".mode button").forEach(b => b.onclick = () => setMode(b.dataset.mode));

/* ---------- Rotate hint ---------- */
const rot = $("#rotate");
if (!store.get("avin-rot") && matchMedia("(orientation: portrait)").matches) rot.classList.add("show");
$("#rotate-close").onclick = () => { rot.classList.remove("show"); store.set("avin-rot", "1"); };

/* ---------- Confetti on the last pages ---------- */
let fired = false;
function confetti() {
  if (fired || matchMedia("(prefers-reduced-motion: reduce)").matches) return; fired = true;
  const cv = $("#confetti"), cx = cv.getContext("2d"); cv.width = innerWidth; cv.height = innerHeight;
  const colors = ["#c8102e", "#0e0c0a", "#6a2fa0", "#d6a531", "#f1e6cf"];
  let parts = Array.from({ length: 220 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .5,
    w: 6 + Math.random() * 6, h: 10 + Math.random() * 8, vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2,
    r: Math.random() * 6, vr: -.15 + Math.random() * .3, c: colors[(Math.random() * colors.length) | 0] }));
  (function tick() {
    cx.clearRect(0, 0, cv.width, cv.height);
    parts.forEach(p => { p.y += p.vy; p.x += p.vx; p.r += p.vr; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore(); });
    parts = parts.filter(p => p.y < cv.height + 40);
    if (parts.length) requestAnimationFrame(tick); else cx.clearRect(0, 0, cv.width, cv.height);
  })();
}

/* ---------- Start ---------- */
const saved = parseInt(store.get("avin-page"), 10);
current = Number.isFinite(saved) && saved < N ? saved : 0;
setMode(store.get("avin-mode") === "cinema" ? "cinema" : "book");
if (mode() === "book" && book && current) book.turnToPage(current);
</script>
